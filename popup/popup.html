<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI MultiSearch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2" fill="white" stroke="white"></polygon>
            <polyline points="2 17 12 22 22 17" stroke="white"></polyline>
            <polyline points="2 12 12 17 22 12" stroke="white"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AI MultiSearch</h1>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Prompt Input Card -->
    <div class="prompt-card" id="drop-zone">
      <textarea 
        id="prompt-input" 
        rows="3" 
        placeholder="Compare React Native and Flutter for building a production app..."
        autofocus
      ></textarea>

      <!-- Attachments Container -->
      <div class="attachments-row">
        <label for="file-upload" class="attach-btn" title="Attach files (PDF, images, text, etc.)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </label>
        <input type="file" id="file-upload" multiple style="display: none;">

        <div id="chips-container" class="chips-container">
          <!-- Dynamic Attachment Chips will appear here -->
        </div>
      </div>
    </div>

    <!-- Platform Selection Section -->
    <div class="platform-section">
      <div class="platform-header">
        <span class="section-title">Select AI Platforms</span>
        <label class="select-all-label">
          <span>Select All</span>
          <input type="checkbox" id="select-all-checkbox" checked>
          <span class="custom-checkbox"></span>
        </label>
      </div>

      <!-- Platform Grid (ChatGPT, Gemini, Claude, DeepSeek, Perplexity, Mistral) -->
      <div class="platform-grid" id="platform-grid">
        <!-- Rendered dynamically via JS for state persistence -->
      </div>
    </div>

    <!-- Action Section -->
    <div class="action-section">
      <button id="search-btn" class="primary-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span id="search-btn-text">Search in Selected AIs (4)</span>
      </button>
      <div class="hotkey-tip">Tip: Press <strong>Ctrl + Enter</strong> to search instantly</div>
    </div>
  </div>

  <script src="/icons/platform-icons.js"></script>
  <script src="/utils/platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
